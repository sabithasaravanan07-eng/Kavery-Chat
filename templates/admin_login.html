<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin login · TKEC Helpdesk</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; font: 16px "Segoe UI", Arial, sans-serif; color: #202b3d; background: linear-gradient(rgba(245, 248, 252, 0.91), rgba(245, 248, 252, 0.94)), url("/static/images/campus-building.png") center / cover fixed no-repeat; }
    main { width: min(100%, 420px); padding: 32px; border: 1px solid #dbe4f0; border-radius: 18px; background: rgba(255, 255, 255, 0.95); box-shadow: 0 18px 50px #20395c14; backdrop-filter: blur(5px); }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { color: #69778d; line-height: 1.5; }
    label { display: block; margin: 22px 0 7px; font-weight: 600; }
    input { width: 100%; padding: 12px; border: 1px solid #cdd8e7; border-radius: 9px; font: inherit; }
    button, a.button { display: inline-block; margin-top: 16px; padding: 11px 16px; border: 0; border-radius: 9px; color: white; background: #245b9c; font: inherit; text-decoration: none; cursor: pointer; }
    .error { padding: 11px; border-radius: 8px; color: #8a2222; background: #fff0f0; }
    .back { color: #315b89; }
  </style>
</head>
<body>
  <main>
    <h1>Helpdesk admin</h1>
    <p>Sign in to manage FAQ answers and the public helpdesk content.</p>
    {% if not password_configured %}<p class="error" role="status">Admin sign-in is disabled. Set TKEC_ADMIN_PASSWORD before starting the app.</p>{% endif %}
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required {% if not password_configured %}disabled{% endif %}>
      <label for="password">Admin password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required {% if not password_configured %}disabled{% endif %}>
      <button type="submit" {% if not password_configured %}disabled{% endif %}>Sign in</button>
    </form>
    <p><a class="back" href="{{ url_for('index') }}">Back to helpdesk</a></p>
  </main>
</body>
</html>
